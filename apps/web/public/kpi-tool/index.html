<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visionflow KPI Metrics</title>
  <meta name="description" content="Live KPI metrics page powered by Vision Flow tool definitions." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M3 17L9 11L13 15L21 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M17 7H21V11" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">Visionflow KPI Metrics</span>
          <span class="brand-tagline">Live Vision Flow metrics page</span>
        </div>
      </div>
      <div class="header-controls">
        <div class="live-indicator">
          <div class="live-dot"></div>
          <span>Live</span>
        </div>
        <div class="time-display" id="current-time">--:--:--</div>
        <button class="btn-refresh" id="btn-refresh" type="button" title="Refresh data">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M23 4V10H17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M1 20V14H7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Refresh
        </button>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="summary-bar">
      <div class="summary-item">
        <div class="summary-icon good">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div>
          <div class="summary-count" id="count-good">0</div>
          <div class="summary-label">Healthy</div>
        </div>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-item">
        <div class="summary-icon warning">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h16.9a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z" stroke="currentColor" stroke-width="2"/><line x1="12" y1="9" x2="12" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="17" x2="12.01" y2="17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        </div>
        <div>
          <div class="summary-count" id="count-warning">0</div>
          <div class="summary-label">Warning</div>
        </div>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-item">
        <div class="summary-icon critical">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><line x1="15" y1="9" x2="9" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="9" y1="9" x2="15" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <div>
          <div class="summary-count" id="count-critical">0</div>
          <div class="summary-label">Critical</div>
        </div>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-item">
        <div class="summary-icon total">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/></svg>
        </div>
        <div>
          <div class="summary-count" id="count-total">9</div>
          <div class="summary-label">Total KPIs</div>
        </div>
      </div>
    </section>

    <section class="metrics-grid" id="metrics-grid"></section>

    <section class="detail-section" id="detail-section" hidden>
      <div class="detail-header">
        <div class="detail-title-wrap">
          <div class="detail-status-dot" id="detail-status-dot"></div>
          <h2 class="detail-title" id="detail-title">Metric Detail</h2>
        </div>
        <button class="btn-close" id="btn-close-detail" type="button">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Close
        </button>
      </div>
      <div class="detail-body" id="detail-body"></div>
    </section>

    <section class="trends-section">
      <div class="section-header">
        <h2 class="section-title">Performance Trends <span class="section-subtitle">Last 24 refreshes</span></h2>
      </div>
      <div class="trend-grid" id="trend-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <span>Visionflow KPI Metrics</span>
    <span id="last-updated">Last updated: --</span>
  </footer>

  <script src="./dashboard.js"></script>
</body>
</html>
